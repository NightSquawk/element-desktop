name: Pull Request
on:
    # Privilege escalation necessary access members of the review teams
    # 🚨 We must not execute any checked out code here, and be careful around use of user-controlled inputs.
    pull_request_target: # zizmor: ignore[dangerous-triggers]
        types: [opened, edited, labeled, unlabeled, synchronize]
permissions: {}
jobs:
    action:
        # The upstream workflow queries Element teams using its private bot token.
        if: github.repository_owner == 'element-hq'
        uses: matrix-org/matrix-js-sdk/.github/workflows/pull_request.yaml@19ab080d9eb6127287347c25b3298ce72e741c8f # zizmor: ignore[unpinned-uses]
        permissions:
            pull-requests: write
        secrets:
            ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
